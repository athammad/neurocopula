[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocopula"
version = "0.1.0"
description = "Neural copulas: learn dependence structure with normalizing flows, with vine-copula benchmarks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ahmed Hammad", email = "ahmed.t.hammad@gmail.com" }]
keywords = [
    "copula", "normalizing-flows", "dependence", "tail-dependence",
    "vine-copula", "density-estimation", "risk", "quantitative-finance",
    "pytorch", "zuko",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "zuko>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
vine = ["pyvinecopulib>=0.6"]
regions = ["geopandas>=0.14", "shapely>=2.0"]
gridded = ["xarray>=2023.1", "netCDF4>=1.6"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "ipykernel>=6.25"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "nbconvert>=7.9",
    "nbformat>=5.9",
    "ipykernel>=6.25",
    "pyvinecopulib>=0.6",
    "geopandas>=0.14",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]
all = ["neurocopula[vine,regions,gridded,notebooks,dev]"]

[project.urls]
Homepage = "https://github.com/athammad/neurocopula"
Repository = "https://github.com/athammad/neurocopula"
Issues = "https://github.com/athammad/neurocopula/issues"
Changelog = "https://github.com/athammad/neurocopula/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocopula"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/benchmarks", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that fit models and take tens of seconds (deselect with '-m \"not slow\"')",
    "vine: tests that require the optional pyvinecopulib dependency",
    "network: tests that download data (deselect with -m \"not network\")",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: line length is handled by the formatter.
# B008: function calls in argument defaults are used deliberately.
# C408: dict(a=1, b=2) reads better than a literal when bundling kwargs to pass on.
# SIM108: a ternary is not always clearer than an if/else block.
ignore = ["E501", "B008", "C408", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
